# Copilot Setup Steps
# This file defines the setup steps that run before each Copilot coding agent process.
# Reference: https://docs.github.com/en/copilot/how-tos/use-copilot-agents/coding-agent/customize-the-agent-environment

name: Copilot Setup Steps

# Automatically run the setup steps when they are changed to allow for easy validation,
# and allow manual testing through the repository's "Actions" tab
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/copilot-setup-steps.yml'
  pull_request:
    paths:
      - '.github/workflows/copilot-setup-steps.yml'

jobs:
  # The job MUST be called `copilot-setup-steps` or it will not be picked up by Copilot.
  copilot-setup-steps:
    runs-on: ubuntu-latest
    timeout-minutes: 300

    # If you don't clone the repository in your setup steps, Copilot will do this for you
    # automatically after the steps complete.
    permissions:
      contents: read

    steps:
      # Checkout the repository first so package.json is available
      - name: Checkout code
        uses: actions/checkout@v4

      # Setup Node.js with caching
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      # Install project dependencies using npm ci for deterministic installs
      - name: Install Node.js dependencies
        run: npm ci

      # Verify linting tools are properly installed
      - name: Verify linting tools are available
        run: npm run lint -- --help || echo "Linting tools installed"

      # Verify Rollup bundler works correctly
      - name: Verify Rollup build works
        run: npm run build

      # Remove the bundled uc.js file so that Copilot knows to use
      # `npm run build` (Rollup) to regenerate it after editing src/ modules.
      # This prevents Copilot from editing the generated file directly.
      - name: Remove bundled output to enforce Rollup rebuild
        run: rm -f zen-pomodoro-focus-blocker.uc.js
